<!doctype html><html><head><meta charset="utf-8"></head><body>
<!-- Page chargee par bake.js dans Chromium. Expose window.bakeItem(item, common). -->
<script src="/three/build/three.min.js"></script>
<script src="/three/examples/js/loaders/GLTFLoader.js"></script>
<script src="/three/examples/js/effects/OutlineEffect.js"></script>
<script>
let renderer, effect, grad, CELL_W, CELL_H;
const PAD = 128;
const loader = new THREE.GLTFLoader();
const load = (f) => new Promise((ok, ko) => loader.load("/models/" + f, ok, undefined, ko));

function init(common) {
  CELL_W = common.cell[0]; CELL_H = common.cell[1];
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  // Rendu sur une toile plus large (marge PAD de chaque cote) pour mesurer une silhouette qui deborde de la case.
  renderer.setPixelRatio(1); renderer.setSize(CELL_W + 2 * PAD, CELL_H + 2 * PAD);
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.setClearColor(0x000000, 0);
  effect = new THREE.OutlineEffect(renderer, { defaultThickness: common.outline_thickness * CELL_W / (CELL_W + 2 * PAD), defaultColor: [0, 0, 0] });
  // 3 tons : ombre, milieu, lumiere.
  const d = new Uint8Array([110, 185, 255]);
  grad = new THREE.DataTexture(d, 3, 1, THREE.RedFormat); grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
}

function newScene() {
  const s = new THREE.Scene(); s.add(new THREE.AmbientLight(0xffffff, 0.6));
  const d = new THREE.DirectionalLight(0xffffff, 0.85); d.position.set(-2, 8, -3); s.add(d); return s;
}

// Camera orthographique inclinee ; l'origine du monde tombe sur le point d'ancrage, puis shiftPx remonte
// le contenu pour que le BAS de la silhouette (mesure par fitShift) tombe sur l'ancrage.
function makeCamera(common, half, shiftPx) {
  const a = common.pitch_degrees * Math.PI / 180;
  const ay = common.anchor[1] / CELL_H; // fraction depuis le haut
  const u = 2 * half / CELL_H; // unites monde par pixel
  const top0 = 2 * half * ay - (shiftPx || 0) * u, bottom0 = top0 - 2 * half;
  const left0 = -2 * half * (common.anchor[0] / CELL_W);
  const c = new THREE.OrthographicCamera(left0 - PAD * u, left0 + 2 * half + PAD * u, top0 + PAD * u, bottom0 - PAD * u, 0.1, 80);
  c.position.set(0, 20 * Math.sin(a), 20 * Math.cos(a)); c.lookAt(0, 0, 0);
  c.updateProjectionMatrix();
  return c;
}

function toonify(root, colors) {
  root.traverse((o) => {
    if (!o.isMesh) return; o.frustumCulled = false;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const nm = mats.map((m) => {
      const col = colors && colors[m.name] ? new THREE.Color(colors[m.name]).convertSRGBToLinear() : m.color.clone();
      return new THREE.MeshToonMaterial({ color: col, gradientMap: grad, map: m.map || null });
    });
    o.material = Array.isArray(o.material) ? nm : nm[0];
  });
}

// Remplace la palette Kenney par une version teintee. `cfg` : hue, sat, gray_to_hue ;
// facultatif : l = [base, ecart] (luminosite des couleurs), l_mul (gris), map = liste de
// { from: [teinte_min, teinte_max], s: [sat_min, sat_max] (facultatif), hue, sat, l } qui recolore chaque famille de couleurs
// (ex. feuilles vertes -> rose, tronc brun -> violet sombre).
function huePalette(img, cfg) {
  const targetHue = cfg.hue, sat = cfg.sat, grayToHue = cfg.gray_to_hue;
  const lb = cfg.l ? cfg.l[0] : 0.35, lr = cfg.l ? cfg.l[1] : 0.3, lm = cfg.l_mul || 1;
  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height; const x = c.getContext("2d"); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height); const p = d.data; const tmp = new THREE.Color();
  for (let i = 0; i < p.length; i += 4) {
    tmp.setRGB(p[i] / 255, p[i + 1] / 255, p[i + 2] / 255); const h = {}; tmp.getHSL(h);
    const m = (cfg.map && h.s >= 0.18) ? cfg.map.find((e) => h.h >= e.from[0] && h.h <= e.from[1] && (!e.s || (h.s >= e.s[0] && h.s <= e.s[1]))) : null;
    if (m) tmp.setHSL(m.hue, m.sat, m.l[0] + h.l * m.l[1]);
    else if (h.s < 0.18) tmp.setHSL(grayToHue ? targetHue : 0.74, grayToHue ? sat : 0.5, (grayToHue ? 0.3 + h.l * 0.35 : 0.12 + h.l * 0.38) * lm);
    else tmp.setHSL(targetHue, sat, lb + h.l * lr);
    p[i] = tmp.r * 255; p[i + 1] = tmp.g * 255; p[i + 2] = tmp.b * 255;
  }
  x.putImageData(d, 0, 0); const t = new THREE.CanvasTexture(c); t.flipY = false; t.encoding = THREE.sRGBEncoding; t.magFilter = THREE.NearestFilter; return t;
}

function toonMat(hex, flat) { return new THREE.MeshToonMaterial({ color: new THREE.Color(hex).convertSRGBToLinear(), gradientMap: grad, flatShading: !!flat }); }

// Gemme a facettes : cone haut + fut + cone bas.
function gem(h, r, colTop, colBot) {
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.ConeGeometry(r, h * 0.62, 6), toonMat(colTop, true)); top.position.y = h * 0.31 + h * 0.19; g.add(top);
  const mid = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h * 0.19, 6), toonMat(colBot, true)); mid.position.y = h * 0.095; g.add(mid);
  const bot = new THREE.Mesh(new THREE.ConeGeometry(r, h * 0.19, 6), toonMat(colBot, true)); bot.rotation.x = Math.PI; bot.position.y = -h * 0.095; g.add(bot);
  return g;
}

// Constructeurs d'objets sur mesure. Recoivent la scene et la hauteur du dessus des pieces Kenney.
const builders = {
  crystalCart(scene) {
    const cart = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.28, 0.75), toonMat("#3d2a80")); body.position.y = 0.28; cart.add(body);
    const trim = new THREE.Mesh(new THREE.BoxGeometry(1.16, 0.08, 0.81), toonMat("#ff8a1f")); trim.position.y = 0.44; cart.add(trim);
    [[-0.38, 0.4], [0.38, 0.4], [-0.38, -0.4], [0.38, -0.4]].forEach(([x, z]) => { const w = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.14, 12), toonMat("#1a1036")); w.rotation.x = Math.PI / 2; w.position.set(x, 0.17, z); cart.add(w); });
    [0.2, -0.2].forEach((z) => { const l = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), toonMat("#ffe23b")); l.position.set(0.56, 0.32, z); cart.add(l); });
    const c1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.3, 0.5), toonMat("#ffe23b")); c1.position.set(-0.28, 0.6, 0); cart.add(c1);
    const c2 = c1.clone(); c2.position.x = 0.28; cart.add(c2);
    const g1 = gem(1.25, 0.32, "#19e3ff", "#0fa8d6"); g1.position.y = 0.72; g1.rotation.y = 0.3; cart.add(g1);
    const g2 = gem(0.55, 0.13, "#8ff4ff", "#19e3ff"); g2.position.set(-0.32, 0.62, 0.2); g2.rotation.z = 0.5; cart.add(g2);
    const g3 = gem(0.45, 0.11, "#8ff4ff", "#19e3ff"); g3.position.set(0.3, 0.6, -0.2); g3.rotation.z = -0.55; cart.add(g3);
    scene.add(cart);
  },
  frostTop(scene, baseY) {
    const ice = new THREE.Group(); ice.position.y = baseY;
    const main = gem(1.25, 0.2, "#e6fbff", "#19e3ff"); main.position.y = 0.3; ice.add(main);
    [[0.2, 0.05, 0.4], [-0.2, 0.05, -0.45], [0.05, -0.22, 0.2], [-0.08, 0.22, -0.2]].forEach(([x, z, r]) => { const k = gem(0.5, 0.09, "#8ff4ff", "#19e3ff"); k.position.set(x, 0.12, z); k.rotation.z = r; k.rotation.x = r * 0.6; ice.add(k); });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.035, 8, 32), toonMat("#19e3ff")); ring.rotation.x = Math.PI / 2; ring.position.y = 0.12; ice.add(ring);
    scene.add(ice);
  },
};

// Direction k : l'objet regarde vers l'angle ecran k*45 deg (0 = droite, 2 = bas). Le modele regarde +Z.
const rotationFor = (k) => { const t = k * Math.PI / 4; return Math.atan2(Math.cos(t), Math.sin(t)); };

async function bakeCharacter(item, common) {
  const g = await load(item.model); const root = g.scene; toonify(root, item.palette);
  const box = new THREE.Box3().setFromObject(root);
  root.scale.setScalar(item.height / (box.max.y - box.min.y)); root.position.y = -box.min.y * root.scale.y;
  const wrap = new THREE.Group(); wrap.add(root);
  const s = newScene(); s.add(wrap);
  const mixer = new THREE.AnimationMixer(root); const out = {};
  const first = Object.values(item.animations)[0]; const firstClip = THREE.AnimationClip.findByName(g.animations, first.clip);
  mixer.clipAction(firstClip).play(); mixer.setTime(0);
  const cam = makeCamera(common, item.half_size, fitShift(common, s, item.half_size, (k) => { wrap.rotation.y = rotationFor(k); }));
  for (const [name, a] of Object.entries(item.animations)) {
    const clip = THREE.AnimationClip.findByName(g.animations, a.clip);
    if (!clip) throw new Error(item.model + ": animation absente " + a.clip);
    mixer.stopAllAction(); const act = mixer.clipAction(clip);
    if (!a.loop) { act.setLoop(THREE.LoopOnce, 1); act.clampWhenFinished = true; } // derniere image = pose finale
    act.reset(); act.play();
    const setFrame = (k, f) => {
      wrap.rotation.y = rotationFor(k); if (f === 0) { act.reset(); act.play(); }
      const t = a.loop ? clip.duration * f / a.frames : clip.duration * f / Math.max(1, a.frames - 1);
      mixer.setTime(Math.min(t, clip.duration));
    };
    const res = bakeSheet(common, s, cam, a.frames, common.directions, setFrame);
    out[name] = Object.assign({ frames: a.frames, loop: a.loop }, res);
  }
  return out;
}

// Rend la scene sur la toile large et renvoie ses pixels (la case standard est la fenetre PAD..PAD+CELL).
let scratchCanvas = null;
function grab(scene, cam) {
  if (!scratchCanvas) { scratchCanvas = document.createElement("canvas"); scratchCanvas.width = CELL_W + 2 * PAD; scratchCanvas.height = CELL_H + 2 * PAD; }
  const t = scratchCanvas.getContext("2d", { willReadFrequently: true });
  effect.render(scene, cam); t.clearRect(0, 0, scratchCanvas.width, scratchCanvas.height); t.drawImage(renderer.domElement, 0, 0);
  return t.getImageData(0, 0, scratchCanvas.width, scratchCanvas.height).data;
}
function bbox(d) {
  const W = CELL_W + 2 * PAD, H = CELL_H + 2 * PAD; let x1 = W, x2 = -1, y1 = H, y2 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 16) { if (x < x1) x1 = x; if (x > x2) x2 = x; if (y < y1) y1 = y; if (y > y2) y2 = y; }
  return { x1, x2, y1, y2 };
}
// Mesure la ligne la plus basse opaque (toutes directions) et renvoie le decalage en pixels vers le haut
// qui pose le bas de la silhouette sur la ligne d'ancrage.
function fitShift(common, scene, half, renderDir) {
  const cam = makeCamera(common, half, 0); let bottom = 0;
  for (let k = 0; k < common.directions; k++) { renderDir(k); bottom = Math.max(bottom, bbox(grab(scene, cam)).y2 - PAD); }
  return bottom + 1 - common.anchor[1];
}

const up16 = (n) => Math.ceil(n / 16) * 16;

// Photographie toutes les images (k = direction, f = image) d'une animation. Mesure d'abord l'etendue de la
// silhouette autour de l'ancrage ; si elle depasse la case standard, l'animation recoit sa propre case et son
// propre ancrage (multiples de 16), de sorte que l'ancrage reste exactement la position de jeu sur chaque image.
// setFrame(k, f) pose le modele. Renvoie { png, cell, anchor, custom, clipped }.
function bakeSheet(common, scene, cam, frames, dirs, setFrame) {
  const [ax0, ay0] = common.anchor; let l = 0, r = 0, u = 0, d = 0;
  for (let k = 0; k < dirs; k++) for (let f = 0; f < frames; f++) {
    setFrame(k, f); const b = bbox(grab(scene, cam)); if (b.x2 < 0) continue;
    l = Math.max(l, ax0 - (b.x1 - PAD)); r = Math.max(r, (b.x2 - PAD) - ax0); u = Math.max(u, ay0 - (b.y1 - PAD)); d = Math.max(d, (b.y2 - PAD) - ay0);
  }
  const m = 1; // marge : le bord de la case reste transparent
  const std = l + m <= ax0 && r + m <= CELL_W - ax0 && u + m <= ay0 && d + m <= CELL_H - ay0;
  let cw = CELL_W, ch = CELL_H, ax = ax0, ay = ay0;
  if (!std) {
    ax = up16(Math.max(ax0, l + m, r + m)); cw = 2 * ax; // ancrage au centre de la case
    ay = up16(Math.max(ay0, u + m)); ch = ay + up16(Math.max(CELL_H - ay0, d + m));
  }
  if (cw > PAD * 2 + CELL_W - 2 || ch > PAD * 2 + CELL_H - 2) throw new Error("silhouette plus grande que la toile de mesure");
  const sheet = document.createElement("canvas"); sheet.width = cw * frames; sheet.height = ch * dirs; const sx = sheet.getContext("2d");
  for (let k = 0; k < dirs; k++) for (let f = 0; f < frames; f++) {
    setFrame(k, f); grab(scene, cam);
    sx.drawImage(scratchCanvas, PAD + ax0 - ax, PAD + ay0 - ay, cw, ch, f * cw, k * ch, cw, ch);
  }
  return { png: sheet.toDataURL("image/png"), cell: [cw, ch], anchor: [ax, ay], custom: !std, clipped: countClipped(sx, frames, dirs, cw, ch) };
}

function countClipped(sx, frames, dirs, cw, ch) {
  let n = 0;
  for (let k = 0; k < dirs; k++) for (let f = 0; f < frames; f++) {
    const d = sx.getImageData(f * cw, k * ch, cw, ch).data;
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      if (x > 0 && x < cw - 1 && y > 0 && y < ch - 1) continue;
      if (d[(y * cw + x) * 4 + 3] > 16) n++;
    }
  }
  return n;
}

async function bakeProp(item, common, kenneyImg) {
  const s = newScene(); let y = 0; const rot = [];
  const pals = {};
  for (const p of item.parts) {
    const g = await load(p.model); const r = g.scene;
    if (!pals[p.palette]) { const cfg = common.kenney_palettes[p.palette]; pals[p.palette] = huePalette(kenneyImg, cfg); }
    r.traverse((o) => { if (o.isMesh) o.material.map = pals[p.palette]; });
    toonify(r); r.position.y = y; s.add(r); if (p.rotates) rot.push(r);
    y = new THREE.Box3().setFromObject(r).max.y;
  }
  if (item.builder) builders[item.builder](s, y);
  const setDir = (k) => rot.forEach((r) => { r.rotation.y = rotationFor(k); });
  if (item.animations) return bakeSynthetic(item, common, s, setDir);
  const cam = makeCamera(common, item.half_size, fitShift(common, s, item.half_size, setDir));
  const res = bakeSheet(common, s, cam, 1, item.directions, (k) => setDir(k));
  return { idle: Object.assign({ frames: 1, loop: true }, res) };
}

// Animations synthetiques pour un modele fixe (sans squelette) : on anime un groupe qui enveloppe la scene.
// `synth` : spin_bob (tour complet sur soi + oscillation verticale, boucle), shake (secousse, une fois),
// shrink_spin (rapetisse en tournant, une fois ; derniere image = taille `end_scale`). `item.scale` agrandit le tout.
const synthPoses = {
  spin_bob: (t) => ({ ry: 2 * Math.PI * t, y: 0.06 * Math.sin(4 * Math.PI * t) + 0.06, x: 0, s: 1 }),
  shake: (t) => ({ ry: 0.25 * Math.sin(2 * Math.PI * t * 2), y: 0, x: 0.09 * Math.sin(2 * Math.PI * t * 2) * (1 - t), s: 1 }),
  shrink_spin: (t, a) => ({ ry: 4 * Math.PI * t, y: 0.12 * Math.sin(Math.PI * t), x: 0, s: 1 - (1 - (a.end_scale || 0.08)) * t }),
};
function bakeSynthetic(item, common, scene, setDir) {
  const wrap = new THREE.Group(); const kids = scene.children.filter((c) => !c.isLight);
  kids.forEach((c) => wrap.add(c)); scene.add(wrap);
  const sc = item.scale || 1; const out = {};
  const pose = (a, k, f) => {
    setDir(k);
    const t = a.loop ? f / a.frames : f / Math.max(1, a.frames - 1);
    const p = synthPoses[a.synth](t, a);
    wrap.rotation.y = p.ry; wrap.position.set(p.x, p.y, 0); wrap.scale.setScalar(sc * p.s);
  };
  pose({ synth: "spin_bob", loop: true, frames: 8 }, 0, 0); wrap.rotation.y = 0; wrap.position.set(0, 0, 0);
  const cam = makeCamera(common, item.half_size, fitShift(common, scene, item.half_size, (k) => { setDir(k); }));
  for (const [name, a] of Object.entries(item.animations)) {
    if (!synthPoses[a.synth]) throw new Error(item.model + ": animation synthetique inconnue " + a.synth);
    const res = bakeSheet(common, scene, cam, a.frames, item.directions, (k, f) => pose(a, k, f));
    out[name] = Object.assign({ frames: a.frames, loop: a.loop }, res);
  }
  return out;
}

window.bakeItem = async (item, common) => {
  if (!renderer) init(common);
  if (item.kind === "character") return bakeCharacter(item, common);
  const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = "/models/kenney/Textures/colormap.png"; });
  return bakeProp(item, common, img);
};
</script></body></html>
